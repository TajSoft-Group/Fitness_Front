# Mubingym admin panel on the host nginx: every domain proxies to the web container on 127.0.0.1:8082 (PORT in .env).
# Domains are independent: each has its own server block and its own certificate.
# HTTP only: certbot --nginx adds HTTPS and the redirect. The server keeps a COPY of this file in sites-available,
# not a link: certbot edits the copy, and a deploy (git reset) does not touch it.
# Another domain: a copy of the server block below with its name.

# admin.mubingym.com

server {
    listen 80;
    listen [::]:80;
    server_name admin.mubingym.com;

    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
