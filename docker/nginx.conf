# Inside the web container. Only the host nginx reaches it (the port is published on 127.0.0.1);
# HTTPS and HSTS are the host nginx's job (deploy/mubingym-admin.conf).

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    charset utf-8;
    server_tokens off;

    # A static site: nothing is ever posted to it.
    client_max_body_size 1k;

    # Repeated in every location that sets its own add_header (nginx does not inherit them).
    # Google Fonts and Chart.js (index.html) come from outside; images and data come from the API.
    set $csp "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: __API_URL__; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' __API_URL__; frame-ancestors 'none'; base-uri 'self'; form-action 'self'";

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy $csp always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # Vite assets have a hash in the name.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    # Single-page app: every route is index.html, which must never be cached (it names the current assets).
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy $csp always;
        try_files $uri /index.html;
    }

    location = /favicon.ico { access_log off; log_not_found off; }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
